# This workflow verifies the quality of pull requests.
# It covers three parallel checks: Analyze and Test
---
name: Verify

on:
  workflow_dispatch:
  pull_request:

jobs:
  lock:
    name: Lock
    runs-on: ubuntu-20.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: suzuki-shunsuke/lock-action@latest
        with:
          mode: 'lock'
          key: 'pr-lock'
          fail_if_locked: "true"
